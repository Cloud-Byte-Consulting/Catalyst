name: "Catalyst API"
description: "Invoke a Catalyst API golden-path operation from a workflow"
inputs:
  endpoint:
    description: "Catalyst API base URL (no trailing slash)"
    required: true
  operation:
    description: "Operation path appended to endpoint (e.g. services/onboard)"
    required: true
  method:
    description: "HTTP method"
    required: false
    default: "POST"
  payload:
    description: "JSON payload"
    required: false
    default: "{}"
runs:
  using: composite
  steps:
    - name: Validate required inputs
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        [ -n "${{ inputs.endpoint }}" ] || missing+=("endpoint")
        [ -n "${{ inputs.operation }}" ] || missing+=("operation")
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::missing required input(s): ${missing[*]}"
          exit 1
        fi
        if [ -z "${CATALYST_ACTION_ROLE_ARN:-}" ]; then
          echo "::error::CATALYST_ACTION_ROLE_ARN env var must be set by the calling workflow"
          exit 1
        fi
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.CATALYST_ACTION_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION || 'us-west-2' }}
    - name: Call Catalyst API
      shell: bash
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        OPERATION: ${{ inputs.operation }}
        METHOD: ${{ inputs.method }}
        PAYLOAD: ${{ inputs.payload }}
      run: |
        set -euo pipefail
        url="${ENDPOINT%/}/${OPERATION#/}"
        echo "Calling ${METHOD} ${url}"
        http_code=$(
          curl -sS -o response.json -w "%{http_code}" \
            -X "${METHOD}" "${url}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"
        )
        echo "HTTP ${http_code}"
        cat response.json
        if [ "${http_code}" -ge 400 ]; then
          echo "::error::Catalyst API call failed (${http_code})"
          exit 1
        fi
