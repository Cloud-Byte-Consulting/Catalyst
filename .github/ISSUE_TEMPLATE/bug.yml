name: Bug
description: Report a defect in Catalyst infra, services, CLI, or workflows
title: "[bug] "
labels:
  - type/bug
  - state/pending
body:
  - type: markdown
    attributes:
      value: |
        ## Required labels (add after create)

        Add construct anchors and exactly one `kind/*` label for agent routing
        (`kind/service`, `kind/iac`, `kind/cicd`, `kind/security`, …).
        See [`STATE-MACHINE.md` §2.7–2.8](https://github.com/Cloud-Byte-Consulting/Catalyst/blob/release/docs/ADR/STATE-MACHINE.md).
        Avoid deprecated `Kind/*` and `Priority/*` labels.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What were you trying to do and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands, payload, or workflow inputs.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, terraform output, screenshots. Redact secrets.
    validations:
      required: false
