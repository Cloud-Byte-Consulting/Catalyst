name: Feature
description: Track a feature with Context/Scope/Gherkin contract
title: "[feature] "
labels:
  - type/feature
  - state/pending
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed and what problem it solves.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Explicit in/out boundaries.
    validations:
      required: true
  - type: textarea
    id: gherkin
    attributes:
      label: Gherkin Acceptance Criteria
      description: Use Given/When/Then scenarios.
      value: |
        ```gherkin
        Feature: <name>
          Scenario: <scenario name>
            Given ...
            When ...
            Then ...
        ```
    validations:
      required: true
