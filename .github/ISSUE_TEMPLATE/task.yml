name: Task
description: Platform task with executable acceptance criteria
title: "[task] "
labels:
  - type/task
  - state/pending
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Reference parent issues and prior decisions.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Explicit in/out boundaries.
    validations:
      required: true
  - type: textarea
    id: gherkin
    attributes:
      label: Gherkin Acceptance Criteria
      description: Use Given/When/Then scenarios so the implementer can write tests directly from this block.
      value: |
        ```gherkin
        Feature: <name>
          Scenario: <scenario name>
            Given ...
            When ...
            Then ...
        ```
    validations:
      required: true
