name: Terraform
# Single consolidated Terraform pipeline (modeled on the HashiCorp setup-terraform
# starter template) that handles both PR plans and release applies.
#
# - On `pull_request` against `release`: assumes the bootstrap-managed plan role
#   (`catalyst-github-plan`, ReadOnlyAccess) and runs init + fmt -check + plan,
#   leaving a sticky comment on the PR with the rendered plan.
# - On `push` to `release`: assumes the apply role (`catalyst-github-apply`,
#   PowerUserAccess + scoped iam:* for `catalyst-*` resources) and runs
#   init + apply -auto-approve.
#
# Quality gates (`terraform-quality` in `pr-checks.yml`: fmt, validate, tflint,
# tfsec, Checkov, Trivy) remain a sibling workflow so the same PR gets both the
# operational plan AND the static security scan. Drift detection runs on its own
# schedule via `tf-drift.yml`.
#
# OIDC trust note: we intentionally do NOT bind to a GitHub Actions environment.
# The bootstrap-provisioned `catalyst-github-{plan,apply}` roles trust the JWT
# subjects `repo:OWNER/REPO:pull_request` and
# `repo:OWNER/REPO:ref:refs/heads/release`. Adding `environment:` mutates the
# JWT `sub` to include `:environment:<name>` and breaks AssumeRoleWithWebIdentity.
# To gate apply behind a manual environment approval, first update the
# bootstrap-managed role trust policies to accept the env-scoped subject.

on:
  push:
    branches: [release]
    paths:
      - infrastructure/**
      - .github/workflows/terraform.yml
  pull_request:
    branches: [release]
    paths:
      - infrastructure/**
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_IN_AUTOMATION: 'true'
  CATALYST_API_INGRESS_ALLOWLIST: ${{ vars.CATALYST_API_INGRESS_ALLOWLIST || '["73.239.59.22/32"]' }}
  # `lambda_image_seeded` gates the Lambda runtime on whether service-cd has
  # ever pushed `:latest` to ECR. First apply leaves it false (provisions
  # everything except the Lambda); operators flip the
  # `CATALYST_LAMBDA_IMAGE_SEEDED` repo variable to "true" after service-cd
  # seeds the image, and the next apply brings the Lambda online. Without a
  # wired CI variable the default never moves off `false`, so service-cd has
  # no chain forward.
  TF_VAR_lambda_image_seeded: ${{ vars.CATALYST_LAMBDA_IMAGE_SEEDED || 'false' }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: ${{ vars.BOOTSTRAP_AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.BOOTSTRAP_AWS_ACCOUNT_ID }}
      CATALYST_PREFIX: ${{ vars.BOOTSTRAP_CATALYST_PREFIX || 'catalyst' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Apply path: any push or workflow_dispatch on release. PR plans
          # use the read-only plan role.
          role-to-assume: ${{ (github.ref == 'refs/heads/release' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && secrets.AWS_ROLE_APPLY_ARN || secrets.AWS_ROLE_PLAN_ARN }}
          aws-region: ${{ vars.BOOTSTRAP_AWS_REGION || 'us-east-1' }}

      - name: Resolve backend bucket name
        id: backend
        run: |
          if [ -z "${AWS_ACCOUNT_ID}" ]; then
            AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          fi
          BUCKET="${CATALYST_PREFIX}-tf-state-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "Resolved backend bucket: ${BUCKET}"

      - name: Normalize API ingress allowlist
        run: |
          python - <<'PY'
          import ipaddress
          import json
          import os

          raw = (os.environ.get("CATALYST_API_INGRESS_ALLOWLIST") or "").strip()
          if not raw:
              entries = []
          else:
              try:
                  parsed = json.loads(raw)
                  if not isinstance(parsed, list):
                      raise ValueError("CATALYST_API_INGRESS_ALLOWLIST JSON must be an array")
                  entries = [str(item).strip() for item in parsed]
              except json.JSONDecodeError:
                  entries = [part.strip() for part in raw.replace("\n", ",").split(",")]

          normalized: list[str] = []
          for entry in entries:
              if not entry:
                  continue
              candidate = entry if "/" in entry else f"{entry}/32"
              network = ipaddress.ip_network(candidate, strict=False)
              if network.version != 4:
                  raise ValueError(f"Only IPv4 entries are supported: {entry}")
              normalized.append(str(network))

          normalized = list(dict.fromkeys(normalized))
          if not normalized:
              raise ValueError("CATALYST_API_INGRESS_ALLOWLIST must include at least one IPv4 CIDR or IP")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"TF_VAR_alb_ingress_allowlist={json.dumps(normalized)}\n")
              fh.write(f"NORMALIZED_API_INGRESS_ALLOWLIST={','.join(normalized)}\n")

          print(f"Normalized API ingress allowlist: {normalized}")
          PY

      - name: Terraform Init
        run: |
          terraform -chdir=infrastructure init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format
        run: terraform -chdir=infrastructure fmt -recursive -check

      - name: Terraform Plan
        if: ${{ !(github.ref == 'refs/heads/release' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
        # -lock=false because the plan OIDC role (ReadOnlyAccess) cannot
        # acquire the DynamoDB state lock. Apply (release push / dispatch
        # path) uses the lock normally.
        run: terraform -chdir=infrastructure plan -no-color -lock=false -input=false | tee plan.txt

      - name: Sticky plan comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: plan.txt

      - name: Terraform Apply
        # Run apply on push to release (gated CI) and on workflow_dispatch
        # against release (manual operator path used when flipping
        # CATALYST_LAMBDA_IMAGE_SEEDED or re-converging after a no-infra
        # change). Bootstrap-managed apply role only trusts
        # `repo:OWNER/REPO:ref:refs/heads/release` so dispatch from any
        # other branch will fail at AssumeRoleWithWebIdentity by design.
        if: github.ref == 'refs/heads/release' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform -chdir=infrastructure apply -auto-approve -input=false
