name: pr-checks
on:
  pull_request:
    branches: [release]
permissions:
  contents: read
jobs:
  actionlint:
    # Lint GitHub Actions workflows on every PR that touches .github/workflows/**.
    # Gated by `paths` at the job level via dorny/paths-filter so unrelated PRs
    # don't waste a runner. Required-status posture matches python-tests: when
    # a PR touches workflows, this must pass before merge.
    #
    # Kaizen scope (#127): adding the gate. If actionlint flags pre-existing
    # issues in current workflow files, those are tracked as a separate
    # follow-up kaizen — not fixed in this PR.
    runs-on: ubuntu-latest
    # dorny/paths-filter@v3 calls the listFiles API on the PR to decide
    # whether to run actionlint. That requires pull-requests:read.
    # Job-level permissions override the workflow-level default entirely,
    # so contents:read must be re-declared here.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
      - name: Run actionlint
        if: steps.changes.outputs.workflows == 'true'
        uses: raven-actions/actionlint@v2
        with:
          version: latest
          # Advisory mode for the first landing per #127's stated direction
          # ("the PR is still mergeable — they'll surface as a follow-up issue").
          # The current workflows have 20 pre-existing shellcheck-style findings
          # (SC2129, SC2086) tracked in a follow-up kaizen issue. Once those are
          # cleaned up, flip this to `fail-on-error: true` so the gate actually
          # gates. Findings are still visible in the run log as annotations.
          fail-on-error: false
  terraform-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform -chdir=infrastructure fmt -recursive -check
      - name: Terraform init
        run: terraform -chdir=infrastructure init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infrastructure validate
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
      - name: Run TFLint
        run: |
          tflint --init --chdir infrastructure
          tflint --chdir infrastructure
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure
      - name: Checkov
        run: |
          pip install checkov
          checkov -d infrastructure --quiet --soft-fail
      - name: Trivy IaC
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: '0'
      # - name: gitleaks
      #   uses: gitleaks/gitleaks-action@v2
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        # The e2e suite imports both the API and the CLI (journey 06
        # drives the client-side presigned-STS flow), so install the
        # CLI dev requirements alongside the API dev requirements.
        run: |
          pip install -r services/catalyst-api/requirements-dev.txt
          pip install -r clients/catalyst-cli/requirements.txt
          pip install -r clients/catalyst-cli/requirements-dev.txt
      - name: Run API unit pytest
        run: pytest services/catalyst-api/tests --cov=services/catalyst-api/catalyst --cov-branch --cov-fail-under=85
      - name: Run e2e regression suite (mock mode, #207)
        # Mock mode only — CATALYST_E2E_LIVE is intentionally unset so
        # the suite runs against the in-process FastAPI TestClient. The
        # live-mode invocation lives in ci-smoke.yml behind a manual
        # dispatch input. See docs/e2e-testing.md.
        run: pytest tests/e2e/ -v
  cursor-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate MCP JSON files
        run: |
          python -m json.tool .cursor/mcp.json > /dev/null
          python -m json.tool .mcp.json > /dev/null
      - name: No merge conflict markers in .cursor/agents
        run: |
          if grep -rE '^(<<<<<<<|=======|>>>>>>>)' .cursor/agents/; then
            echo "Merge conflict markers found in .cursor/agents/"
            exit 1
          fi
  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI + dev deps
        run: |
          pip install -r clients/catalyst-cli/requirements.txt
          pip install -r clients/catalyst-cli/requirements-dev.txt
      - name: Run CLI tests
        # `-m 'not live'` excludes the opt-in live-stack smoke suite (#157)
        # which auto-skips without CATALYST_API_ENDPOINT anyway; the explicit
        # marker filter keeps the suite output clean ("0 deselected" beats
        # a wall of "skipped: requires endpoint").
        run: pytest clients/catalyst-cli/tests -v -m 'not live' --cov=catalyst_cli --cov-branch --cov-fail-under=80 --cov-report=term-missing
