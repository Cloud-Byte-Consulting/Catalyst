name: multi-tool-sync

on:
  pull_request:
    branches: [release, main]
  push:
    branches: [release, main]

jobs:
  check-sync:
    name: Verify Claude/Cursor stubs match canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify every canonical skill has both tool stubs
        run: |
          set -euo pipefail
          missing=0
          for d in skills/*/; do
            name=$(basename "$d")
            if [ ! -f ".claude/skills/$name/SKILL.md" ]; then
              echo "::error::Missing .claude/skills/$name/SKILL.md for canonical skills/$name/"
              missing=$((missing + 1))
            fi
            if [ ! -f ".cursor/skills/$name/SKILL.md" ]; then
              echo "::error::Missing .cursor/skills/$name/SKILL.md for canonical skills/$name/"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing tool-stub file(s) missing. Run: python scripts/sync_tool_skills.py"
            exit 1
          fi

      - name: Verify every canonical agent has a Claude adapter
        run: |
          set -euo pipefail
          missing=0
          for f in agents/*.md; do
            name=$(basename "$f" .md)
            if [ ! -f ".claude/agents/$name.md" ]; then
              echo "::error::Missing .claude/agents/$name.md adapter for canonical agents/$name.md"
              missing=$((missing + 1))
            fi
            if [ ! -f ".cursor/agents/$name.md" ]; then
              echo "::error::Missing .cursor/agents/$name.md stub for canonical agents/$name.md"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing agent stub/adapter file(s) missing."
            exit 1
          fi

      - name: Verify stub contents match canonical (no drift)
        run: |
          python scripts/sync_tool_skills.py --check
