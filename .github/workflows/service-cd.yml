name: service-cd
# Catalyst API image build + runtime update.
# This workflow does NOT provision infrastructure. The ECR repository, ECS
# cluster/ALB, Lambda function, security groups, SSM parameters, etc. are all
# created by tf-apply (root config in infrastructure/). This workflow only
# builds the container image, pushes to ECR, and points the runtime (Lambda or
# ECS service) at the new tag.
#
# Job split (CICD-5 / fix #68):
#   build-and-push  — always runs; seeds :latest on first cold start.
#   deploy          — needs build-and-push; gated on the runtime SSM param
#                     existing. On first cold start (Lambda not yet
#                     provisioned), Deploy logs the bootstrap dance instead
#                     of failing so the next operator action is unambiguous.
on:
  push:
    branches: [release]
    paths:
      - services/catalyst-api/**
  workflow_dispatch:
    inputs:
      runtime:
        description: lambda or ecs
        required: false
        default: ''
permissions:
  id-token: write
  contents: read
env:
  # Source of truth lives on the BOOTSTRAP_AWS_REGION repo variable so
  # service-cd cannot drift away from where terraform.yml + tf-drift.yml are
  # provisioning resources. Falls back to us-east-1 (the documented default).
  AWS_REGION: ${{ vars.BOOTSTRAP_AWS_REGION || 'us-east-1' }}
  RUNTIME: ${{ inputs.runtime || vars.RUNTIME || 'lambda' }}
jobs:
  build-and-push:
    # Always runs. Cannot abort the bootstrap seeding of ECR :latest because
    # of a downstream gate — that was the root cause of the chicken-and-egg
    # failure described in #68.
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_DEPLOY_ARN }}
          aws-region: ${{ vars.BOOTSTRAP_AWS_REGION || 'us-east-1' }}
      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        id: push
        # ECR is IMMUTABLE, so `:${GITHUB_SHA}` is always a unique manifest.
        # We additionally push `:latest` the FIRST time only — the Lambda
        # module bootstraps with `image_uri = ${ECR}:latest`, so the tag has
        # to exist before `lambda_image_seeded=true` apply runs. After that
        # `:latest` is frozen by IMMUTABLE; subsequent rolls update Lambda
        # in place via `aws lambda update-function-code --image-uri ${ECR}:${SHA}`.
        run: |
          set -euo pipefail
          ECR_URI=$(aws ssm get-parameter --name /catalyst/shared/ecr/catalyst-api/uri --query Parameter.Value --output text)
          REPO_NAME=$(basename "${ECR_URI}")
          # Build context is the repo root (not services/catalyst-api) so the
          # Dockerfile can COPY the bundled L4 composite at
          # infrastructure/modules/composite/catalyst-app into the image.
          # Required by #167 (synchronous Terraform-in-Lambda onboard).
          docker build -t ${ECR_URI}:${GITHUB_SHA} -f services/catalyst-api/Dockerfile .
          docker push ${ECR_URI}:${GITHUB_SHA}
          if ! aws ecr describe-images --repository-name "${REPO_NAME}" --image-ids imageTag=latest >/dev/null 2>&1; then
            echo "Seeding ${ECR_URI}:latest (one-time bootstrap)"
            docker tag ${ECR_URI}:${GITHUB_SHA} ${ECR_URI}:latest
            docker push ${ECR_URI}:latest
          else
            echo "${ECR_URI}:latest already exists; skipping bootstrap re-tag (ECR IMMUTABLE)"
          fi
          echo "image-uri=${ECR_URI}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_DEPLOY_ARN }}
          aws-region: ${{ vars.BOOTSTRAP_AWS_REGION || 'us-east-1' }}
      - name: Check Lambda runtime readiness
        id: lambda-ready
        if: env.RUNTIME == 'lambda'
        # First-cold-start safety net: if the Lambda function (and its SSM
        # param) has not been provisioned yet, log the bootstrap dance
        # instead of failing. The image has already been pushed to ECR by
        # the previous job, so the operator can now flip
        # CATALYST_LAMBDA_IMAGE_SEEDED=true and re-run terraform.yml.
        #
        # No-op vs real failure (kaizen #128): we explicitly probe for
        # ParameterNotFound and only then emit the ::warning:: + exit 0.
        # Any other ssm:GetParameter error (e.g. AccessDenied, throttling)
        # still surfaces as a job failure — exit 0 is reserved for the
        # bootstrap-dance no-op path described in ADR-006 §Phase-ordering.
        run: |
          set -uo pipefail
          if aws ssm get-parameter --name /catalyst/shared/lambda/catalyst-api/arn >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Param missing OR call failed — distinguish so we don't mask
          # an AccessDenied behind the bootstrap-dance no-op.
          err=$(aws ssm get-parameter --name /catalyst/shared/lambda/catalyst-api/arn 2>&1 >/dev/null || true)
          if ! echo "${err}" | grep -q ParameterNotFound; then
            echo "::error::ssm:GetParameter failed for /catalyst/shared/lambda/catalyst-api/arn (not a bootstrap no-op): ${err}"
            exit 1
          fi
          echo "::warning::Lambda runtime not yet provisioned — bootstrap dance no-op (ECR seeded; flip CATALYST_LAMBDA_IMAGE_SEEDED=true and re-run terraform.yml). See ADR-006 §Phase-ordering."
          {
            echo "## Lambda cold-start bootstrap dance (no-op)"
            echo ""
            echo "The Lambda function is not yet provisioned (SSM param"
            echo "\`/catalyst/shared/lambda/catalyst-api/arn\` missing). The image has"
            echo "already been seeded in ECR by the \`build-and-push\` job, so the"
            echo "deploy step is skipped without failing the workflow."
            echo ""
            echo "**Next steps:**"
            echo "1. Image is now seeded in ECR (build-and-push step completed)."
            echo "2. Set repository variable \`CATALYST_LAMBDA_IMAGE_SEEDED=true\`."
            echo "3. Re-run \`terraform.yml\` on \`release\` to provision the Lambda function."
            echo "4. Re-run this workflow to update the Lambda with the latest image."
            echo ""
            echo "See [ADR-006 §Phase-ordering — Bootstrap dance](../blob/release/docs/ADR/ADR-006-cicd-pipeline-architecture.md#bootstrap-dance-seed-first-deploy-second)"
            echo "(amended by #126; fix #125; root bug #68)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ready=false" >> "$GITHUB_OUTPUT"
      - name: Check ECS runtime readiness
        id: ecs-ready
        if: env.RUNTIME == 'ecs'
        # Same no-op-vs-real-failure split as the Lambda step — see comment
        # there. Bootstrap dance for ECS lands the cluster via terraform.yml
        # rather than a CATALYST_*_SEEDED flag, but the cold-start ergonomics
        # are identical: image already in ECR, runtime not yet provisioned.
        run: |
          set -uo pipefail
          if aws ssm get-parameter --name /catalyst/shared/ecs/cluster/arn >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          err=$(aws ssm get-parameter --name /catalyst/shared/ecs/cluster/arn 2>&1 >/dev/null || true)
          if ! echo "${err}" | grep -q ParameterNotFound; then
            echo "::error::ssm:GetParameter failed for /catalyst/shared/ecs/cluster/arn (not a bootstrap no-op): ${err}"
            exit 1
          fi
          echo "::warning::ECS runtime not yet provisioned — bootstrap dance no-op (ECR seeded; run terraform.yml on release to provision the cluster). See ADR-006 §Phase-ordering."
          {
            echo "## ECS cold-start bootstrap dance (no-op)"
            echo ""
            echo "The ECS cluster is not yet provisioned (SSM param"
            echo "\`/catalyst/shared/ecs/cluster/arn\` missing). The image has already"
            echo "been seeded in ECR by the \`build-and-push\` job, so the deploy step"
            echo "is skipped without failing the workflow."
            echo ""
            echo "**Next step:** run \`terraform.yml\` on \`release\` to provision the"
            echo "cluster, then re-run this workflow to roll the service."
            echo ""
            echo "See [ADR-006 §Phase-ordering — Bootstrap dance](../blob/release/docs/ADR/ADR-006-cicd-pipeline-architecture.md#bootstrap-dance-seed-first-deploy-second)"
            echo "(amended by #126; fix #125; root bug #68)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ready=false" >> "$GITHUB_OUTPUT"
      - name: Deploy lambda
        if: env.RUNTIME == 'lambda' && steps.lambda-ready.outputs.ready == 'true'
        run: |
          aws lambda update-function-code \
            --function-name catalyst-api \
            --image-uri "${IMAGE_URI}"
      - name: Deploy ecs
        if: env.RUNTIME == 'ecs' && steps.ecs-ready.outputs.ready == 'true'
        run: |
          CLUSTER=$(aws ssm get-parameter --name /catalyst/shared/ecs/cluster/arn --query Parameter.Value --output text)
          SERVICE=$(aws ssm get-parameter --name /catalyst/shared/ecs/service/name --query Parameter.Value --output text)
          TASK_DEF=$(aws ecs describe-services --cluster ${CLUSTER} --services ${SERVICE} --query 'services[0].taskDefinition' --output text)
          aws ecs update-service --cluster ${CLUSTER} --service ${SERVICE} --task-definition ${TASK_DEF}
