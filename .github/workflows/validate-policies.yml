# DEPRECATED on GitHub — migrated to .gitea/workflows/validate-policies.yaml (#340)
# DO NOT MERGE #340 until Gitea Actions verified green (#338).
name: validate-policies
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Emergency fallback — primary CI is Gitea Actions"
        required: false
        type: string
jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          wget -qO- https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/conftest
      - name: Validate policy bundle syntax
        run: conftest verify --policy infrastructure/policy/opa
