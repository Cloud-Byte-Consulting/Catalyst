name: tf-plan
on:
  pull_request:
    branches: [release]
    paths:
      - infrastructure/**
permissions:
  id-token: write
  contents: read
  pull-requests: write
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_PLAN_ARN }}
          aws-region: us-west-2
      - name: Terraform init
        run: terraform -chdir=infrastructure init
      - name: Terraform plan
        run: terraform -chdir=infrastructure plan -no-color | tee plan.txt
      - name: Sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: plan.txt
