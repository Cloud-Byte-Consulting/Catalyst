name: tf-drift
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  CATALYST_API_INGRESS_ALLOWLIST: ${{ vars.CATALYST_API_INGRESS_ALLOWLIST || '["73.239.59.22"]' }}
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_PLAN_ARN }}
          aws-region: us-west-2
      - name: Normalize API ingress allowlist
        run: |
          python - <<'PY'
          import ipaddress
          import json
          import os

          raw = (os.environ.get("CATALYST_API_INGRESS_ALLOWLIST") or "").strip()
          if not raw:
              entries = []
          else:
              try:
                  parsed = json.loads(raw)
                  if not isinstance(parsed, list):
                      raise ValueError("CATALYST_API_INGRESS_ALLOWLIST JSON must be an array")
                  entries = [str(item).strip() for item in parsed]
              except json.JSONDecodeError:
                  entries = [part.strip() for part in raw.replace("\n", ",").split(",")]

          normalized: list[str] = []
          for entry in entries:
              if not entry:
                  continue
              candidate = entry if "/" in entry else f"{entry}/32"
              network = ipaddress.ip_network(candidate, strict=False)
              if network.version != 4:
                  raise ValueError(f"Only IPv4 entries are supported: {entry}")
              normalized.append(str(network))

          normalized = list(dict.fromkeys(normalized))
          if not normalized:
              raise ValueError("CATALYST_API_INGRESS_ALLOWLIST must include at least one IPv4 CIDR or IP")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"TF_VAR_alb_ingress_allowlist={json.dumps(normalized)}\n")
              fh.write(f"NORMALIZED_API_INGRESS_ALLOWLIST={','.join(normalized)}\n")

          print(f"Normalized API ingress allowlist: {normalized}")
          PY
      - name: Terraform init
        run: terraform -chdir=infrastructure init
      - name: Drift plan
        id: drift
        run: |
          set +e
          terraform -chdir=infrastructure plan -detailed-exitcode -no-color > drift.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
      - name: Publish SNS on drift
        if: steps.drift.outputs.exit_code == '2'
        run: aws sns publish --topic-arn ${{ secrets.DRIFT_SNS_TOPIC_ARN }} --message "Terraform drift detected in Catalyst"
      - name: Open issue on drift
        if: steps.drift.outputs.exit_code == '2'
        run: |
          gh issue create \
            --title "Drift detected: ${GITHUB_SHA}" \
            --body "Automated drift detection found divergence." \
            --label type/kaizen \
            --label state/pending
        env:
          GH_TOKEN: ${{ github.token }}
