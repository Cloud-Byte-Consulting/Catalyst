name: tf-drift
# Scheduled drift detection against the same Terraform state that tf-plan and
# tf-apply manage. Treats any non-zero diff as drift and opens an issue + SNS.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
  issues: write
env:
  TF_IN_AUTOMATION: 'true'
  CATALYST_API_INGRESS_ALLOWLIST: ${{ vars.CATALYST_API_INGRESS_ALLOWLIST || '["73.239.59.22/32"]' }}
  # Mirror terraform.yml so drift plan matches what apply produced.
  TF_VAR_lambda_image_seeded: ${{ vars.CATALYST_LAMBDA_IMAGE_SEEDED || 'false' }}
jobs:
  drift:
    runs-on: ubuntu-latest
    # No `environment:` binding: see terraform.yml for the OIDC trust constraint.
    env:
      AWS_REGION: ${{ vars.BOOTSTRAP_AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.BOOTSTRAP_AWS_ACCOUNT_ID }}
      CATALYST_PREFIX: ${{ vars.BOOTSTRAP_CATALYST_PREFIX || 'catalyst' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # CICD-11a (#130): drift uses its own role because the plan role's
          # OIDC trust sub matches `pull_request` only; scheduled/dispatched
          # runs emit `ref:refs/heads/release`. Security hardening (env-scoped
          # sub + job_workflow_ref) is tracked in #124 (CICD-11b).
          role-to-assume: ${{ secrets.AWS_ROLE_DRIFT_ARN }}
          aws-region: ${{ vars.BOOTSTRAP_AWS_REGION || 'us-east-1' }}
      - name: Resolve backend bucket name
        id: backend
        run: |
          if [ -z "${AWS_ACCOUNT_ID}" ]; then
            AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          fi
          BUCKET="${CATALYST_PREFIX}-tf-state-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "Resolved backend bucket: ${BUCKET}"
      - name: Normalize API ingress allowlist
        run: |
          python - <<'PY'
          import ipaddress
          import json
          import os

          raw = (os.environ.get("CATALYST_API_INGRESS_ALLOWLIST") or "").strip()
          if not raw:
              entries = []
          else:
              try:
                  parsed = json.loads(raw)
                  if not isinstance(parsed, list):
                      raise ValueError("CATALYST_API_INGRESS_ALLOWLIST JSON must be an array")
                  entries = [str(item).strip() for item in parsed]
              except json.JSONDecodeError:
                  entries = [part.strip() for part in raw.replace("\n", ",").split(",")]

          normalized: list[str] = []
          for entry in entries:
              if not entry:
                  continue
              candidate = entry if "/" in entry else f"{entry}/32"
              network = ipaddress.ip_network(candidate, strict=False)
              if network.version != 4:
                  raise ValueError(f"Only IPv4 entries are supported: {entry}")
              normalized.append(str(network))

          normalized = list(dict.fromkeys(normalized))
          if not normalized:
              raise ValueError("CATALYST_API_INGRESS_ALLOWLIST must include at least one IPv4 CIDR or IP")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"TF_VAR_alb_ingress_allowlist={json.dumps(normalized)}\n")
              fh.write(f"NORMALIZED_API_INGRESS_ALLOWLIST={','.join(normalized)}\n")

          print(f"Normalized API ingress allowlist: {normalized}")
          PY
      - name: Terraform init
        run: |
          terraform -chdir=infrastructure init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${AWS_REGION}"
      - name: Drift plan
        id: drift
        run: |
          set +e
          terraform -chdir=infrastructure plan -detailed-exitcode -no-color -lock=false -input=false > drift.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
      - name: Publish SNS on drift
        if: steps.drift.outputs.exit_code == '2' && env.DRIFT_SNS_TOPIC_ARN != ''
        env:
          DRIFT_SNS_TOPIC_ARN: ${{ secrets.DRIFT_SNS_TOPIC_ARN }}
        run: aws sns publish --topic-arn "${DRIFT_SNS_TOPIC_ARN}" --message "Terraform drift detected in Catalyst"
      - name: Open issue on drift
        if: steps.drift.outputs.exit_code == '2'
        run: |
          gh issue create \
            --title "Drift detected: ${GITHUB_SHA}" \
            --body "Automated drift detection found divergence." \
            --label type/kaizen \
            --label state/pending
        env:
          GH_TOKEN: ${{ github.token }}
