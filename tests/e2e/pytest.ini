[pytest]
# Pytest config for the Catalyst e2e regression suite (#207).
#
# Strict markers (per AGENTS.md "strict markers + strict config" rule for
# new Python test suites). The suite does not register any custom
# markers today; declare them here when journeys start needing them so
# we never silently disable a test via a typo.
addopts = --strict-markers --strict-config
testpaths = .
markers =
