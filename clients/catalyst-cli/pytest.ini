[pytest]
# Pytest config for the Catalyst CLI test suite.
#
# Strict markers (per AGENTS.md "strict markers + strict config" rule for
# new Python test suites) — any unregistered marker fails the run, so a
# typo doesn't silently disable a test.

addopts = --strict-markers --strict-config
markers =
    live: opt-in tests that hit a live Catalyst stack (auto-skipped when CATALYST_API_ENDPOINT is unset; #157)
